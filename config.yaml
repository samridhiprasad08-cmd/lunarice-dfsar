# ==========================================================
# Lunar Ice Detection System Configuration
# ==========================================================

project:

  name: "Lunar Ice Detection System"

  version: "1.0"

  mission: "Chandrayaan-2"

  instrument: "DFSAR"

# ==========================================================

paths:

  raw_data: "Data/raw"

  processed_data: "Data/processed"

  temporary_data: "Data/temporary"

  output_data: "Data/outputs"

  reports: "results/reports"

  figures: "figures"

  logs: "logs"

# ==========================================================

datasets:

  dfsar_xml: ""

  dfsar_data: ""

  ohrc: ""

  diviner: ""

  mini_rf: ""

# ==========================================================

processing:

  use_gpu: false

  save_intermediate: true

  verbose: true

# ==========================================================

visualization:

  dpi: 300

  figure_format: "png"

# ==========================================================

logging:

  level: "INFO"

  save_log: true